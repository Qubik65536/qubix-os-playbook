---
- name: Test production desktop candidates in an isolated nested Niri window
  hosts: qubix_targets
  gather_facts: false
  become: false
  pre_tasks:
    - name: Require a real temporary graphical test
      ansible.builtin.assert:
        that: [not ansible_check_mode]
        fail_msg: 'This optional test opens a temporary nested window; check mode cannot test rendering.'
  roles:
    - qubix_profile
    - qubix_discovery
  tasks:
    - name: Require the selected desktop before runtime testing
      ansible.builtin.assert:
        that: [qubix_profile_resolved.niri.enabled]

    - name: Render measured production candidates without installing a session
      ansible.builtin.include_role:
        name: qubix_niri

    - name: Create private user-owned native test directory
      ansible.builtin.tempfile:
        state: directory
        path: /tmp
        prefix: qubix-native-smoke.
      register: qubix_smoke_directory

    - name: Run optional rendering and preservation checks with cleanup
      block:
        - name: Create private candidate configuration directories
          ansible.builtin.file:
            path: '{{ qubix_smoke_directory.path }}/{{ item }}'
            state: directory
            mode: '0700'
          loop: [config/noctalia/palettes, assets, plugins/shortcuts, plugins/power, home/.local/share/applications]

        - name: Define exact candidate paths within the owned test directory
          ansible.builtin.set_fact:
            qubix_smoke_paths:
              /etc/qubix/noctalia/config.toml: config/noctalia/config.toml
              /etc/qubix/noctalia/palettes/Qubix.json: config/noctalia/palettes/Qubix.json
              /usr/share/qubix/bin/qubix-noctalia: qubix-noctalia
              /usr/share/qubix/bin/qubix-output-defaults: qubix-output-defaults
              /etc/niri/qubix/config.kdl: config.kdl
              /usr/share/applications/qubix-power.desktop: home/.local/share/applications/qubix-power.desktop
              /usr/share/qubix/noctalia/plugins/shortcuts/plugin.toml: plugins/shortcuts/plugin.toml
              /usr/share/qubix/noctalia/plugins/shortcuts/panel.luau: plugins/shortcuts/panel.luau
              /usr/share/qubix/noctalia/plugins/shortcuts/bindings.json: plugins/shortcuts/bindings.json
              /usr/share/qubix/noctalia/plugins/power/plugin.toml: plugins/power/plugin.toml
              /usr/share/qubix/noctalia/plugins/power/panel.luau: plugins/power/panel.luau

        - name: Copy production wallpaper to a private candidate path
          ansible.builtin.copy:
            src: '{{ playbook_dir }}/../../assets/wallpaper/qubix.png'
            dest: '{{ qubix_smoke_directory.path }}/assets/wallpaper.png'
            mode: '0600'

        - name: Write production definitions with only test-path substitutions
          ansible.builtin.copy:
            dest: '{{ qubix_smoke_directory.path }}/{{ qubix_smoke_paths[item.path] }}'
            content: >-
              {{ item.content
              | replace('/usr/share/qubix/wallpaper.png', qubix_smoke_directory.path ~ '/assets/wallpaper.png')
              | replace('/usr/share/qubix/bin/qubix-noctalia', qubix_smoke_directory.path ~ '/qubix-noctalia')
              | replace('/usr/share/qubix/noctalia/plugins', qubix_smoke_directory.path ~ '/plugins')
              | replace('NOCTALIA_CONFIG_HOME=/etc/qubix',
                        'NOCTALIA_CONFIG_HOME=' ~ qubix_smoke_directory.path ~ '/config') }}
            mode: '{{ item.mode | default("0600") }}'
            validate: '{{ item.validate | default(omit) }}'
          loop: '{{ qubix_niri_resources | selectattr("path", "in", qubix_smoke_paths) | list }}'
          loop_control:
            label: '{{ item.path }}'

        - name: Use an explicitly supplied earlier presenter for comparison only
          ansible.builtin.copy:
            src: '{{ qubix_shortcuts_reference_panel }}'
            dest: '{{ qubix_smoke_directory.path }}/plugins/shortcuts/panel.luau'
            mode: '0600'
          when: qubix_shortcuts_reference_panel is defined

        - name: Replace power dispatch only in the isolated candidate with a no-effect recorder
          ansible.builtin.replace:
            path: '{{ qubix_smoke_directory.path }}/plugins/power/panel.luau'
            regexp: '{{ (qubix_smoke_directory.path ~ "/qubix-noctalia") | regex_escape }}'
            replace: '{{ qubix_smoke_directory.path }}/power-recorder.py'

        - name: Add an input bridge only to the disposable candidate
          ansible.builtin.blockinfile:
            path: '{{ qubix_smoke_directory.path }}/plugins/power/panel.luau'
            marker: '-- {mark} disposable test input'
            block: |
              function onIpc(event, payload)
                  if event == "test-click" then clickAction(tonumber(payload)) end
              end

        - name: Install the no-effect power recorder only in the private test directory
          ansible.builtin.copy:
            src: files/niri-smoke-power.py
            dest: '{{ qubix_smoke_directory.path }}/power-recorder.py'
            mode: '0700'

        - name: Check the candidate plugin manifests and declared entry files
          ansible.builtin.command:
            argv: [/usr/bin/noctalia, plugins, lint, '{{ qubix_smoke_directory.path }}/plugins/{{ item }}']
          changed_when: false
          loop: [shortcuts, power]

        - name: Transfer native-only test helpers
          ansible.builtin.copy:
            src: >-
              files/niri-smoke-{{ "shortcuts" if item == "inner" and
              qubix_shortcuts_preview_only | default(false) else item }}.py
            dest: '{{ qubix_smoke_directory.path }}/{{ item }}.py'
            mode: '0600'
          loop: [inner, outer]

        - name: Exercise Noctalia in an isolated temporary session
          ansible.builtin.command:
            argv: [/usr/bin/python3, '{{ qubix_smoke_directory.path }}/outer.py', '{{ qubix_smoke_directory.path }}']
          changed_when: true # The explicitly invoked test opens/closes its own temporary graphical window.
          timeout: 120

      always:
        - name: Preserve evidence even after a failed native test
          block:
            - name: Retain test artifacts on the controller
              ansible.builtin.find:
                paths: '{{ qubix_smoke_directory.path }}'
                patterns: ['*.json', '*.png', '*.log']
                file_type: file
              register: qubix_smoke_artifacts

            - name: Fetch available native evidence before cleanup
              ansible.builtin.fetch:
                src: '{{ item.path }}'
                dest: >-
                  {{ playbook_dir }}/../../.cache/native-desktop/{{
                  inventory_hostname | regex_replace('[^A-Za-z0-9_.-]', '_') }}/{{
                  qubix_smoke_artifact_group | default('') | regex_replace('[^A-Za-z0-9_.-]', '_') }}/
                flat: true
              loop: '{{ qubix_smoke_artifacts.files }}'
              loop_control:
                label: '{{ item.path | basename }}'

          always:
            - name: Remove only this test-created directory
              ansible.builtin.file:
                path: '{{ qubix_smoke_directory.path }}'
                state: absent
