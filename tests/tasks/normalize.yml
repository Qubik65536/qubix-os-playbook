---
- name: Load platform package selection definitions
  ansible.builtin.include_vars: ../../config/platforms/cachyos.yml

- name: Normalize representative probe results
  ansible.builtin.include_role:
    name: qubix_discovery
    tasks_from: normalize
  vars:
    ansible_facts:
      system: Linux
      distribution_version: rolling-fixture
      service_mgr: systemd
      env: {}
    qubix_discovery_binaries: {pacman: true, niri: true}
    qubix_discovery_niri_version: {stdout: 'niri fixture-version'}
    qubix_discovery_packages:
      stdout_lines: ['niri 25.08', 'sddm 0.21', 'noctalia-shell 1.0', 'unrelated 1.0', 'grub 2.12']
    qubix_discovery_path_stats:
      results:
        - item: /etc/niri/config.kdl
          stat: {exists: true}
        - item: /efi/limine.conf
          stat: {exists: false}
    qubix_discovery_display_link:
      stat: {lnk_source: /usr/lib/systemd/system/sddm.service}
    qubix_discovery_display_status:
      stdout_lines: ['Id=sddm.service', 'LoadState=loaded', 'ActiveState=active']

- name: Check measured facts are retained and unrelated packages omitted
  ansible.builtin.assert:
    that:
      - qubix_discovery_evidence.packages == ['niri 25.08', 'sddm 0.21', 'noctalia-shell 1.0', 'grub 2.12']
      - qubix_discovery_evidence.paths == ['/etc/niri/config.kdl']
      - qubix_discovery_evidence.niri_version == 'niri fixture-version'
      - qubix_discovery_evidence.desktop_hint == 'unknown'
      - qubix_discovery_evidence.display_manager.configured_unit == '/usr/lib/systemd/system/sddm.service'
