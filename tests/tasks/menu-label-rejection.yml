---
- name: Seed one unsafe synthetic menu input
  ansible.builtin.copy:
    dest: '{{ qubix_root }}/{{ item.path }}'
    content: '{{ item.content }}'
    mode: '0644'
  check_mode: false
  loop:
    - {path: boot/limine.conf, content: '{{ qubix_test_menu_case.menu | default(qubix_test_menu) }}'}
    - {path: etc/default/limine, content: '{{ qubix_test_menu_case.defaults | default(qubix_test_defaults) }}'}
    - {path: etc/limine-entry-tool.conf, content: '{{ qubix_test_menu_case.policy | default("") }}'}
  loop_control:
    label: '{{ item.path }}'

- name: Require refusal before selecting a changed label
  block:
    - name: Plan the unsupported native input through production tasks
      ansible.builtin.include_role:
        name: qubix_bootloader
        tasks_from: menu_label

    - name: Fail if ambiguous native input is accepted
      ansible.builtin.fail:
        msg: Ambiguous native menu input was accepted.
  rescue:
    - name: Require the specific preflight refusal
      ansible.builtin.assert:
        that:
          - >-
            qubix_test_menu_case.diagnostic | default('Ambiguous menu, machine-ID binding or custom TARGET_OS_NAME')
            in (ansible_failed_result.msg ~ ' ' ~
            (ansible_failed_result.results | default([]) | map(attribute='msg') | join(' ')))
