---
- name: Test Noctalia desktop ownership and unsupported dependencies
  hosts: localhost
  gather_facts: false
  vars:
    qubix_profile_resolved:
      branding: {enabled: true}
    qubix_discovery_report:
      evidence:
        binaries: {niri: true, wezterm: true, noctalia: true, jq: true}
        packages: ['fcitx5 5.1', 'fcitx5-chinese-addons 5.1', 'fcitx5-gtk 5.1', 'fcitx5-qt 5.1', 'noto-fonts-cjk 1']
        noctalia_version: noctalia v5.2.1
  tasks:
    - name: Render complete desktop candidate
      ansible.builtin.include_role:
        name: qubix_niri

    - name: Require Pinyin startup and native toolkit integration in the effective desktop
      ansible.builtin.assert:
        that:
          - "'GTK_IM_MODULE \"fcitx\"' in qubix_niri_config_content"
          - "'QT_IM_MODULE \"fcitx\"' in qubix_niri_config_content"
          - "'spawn-at-startup \"/usr/share/qubix/bin/qubix-fcitx5\"' in qubix_niri_config_content"
          - >-
            'DefaultIM=pinyin' in (qubix_niri_resources | selectattr('path', 'equalto',
            '/etc/qubix/fcitx5/profile') | first).content

    - name: Render additive shell defaults
      ansible.builtin.include_role:
        name: qubix_shell

    - name: Require validated resources and preserved native ownership
      ansible.builtin.assert:
        that:
          - qubix_niri_resources | length == 19
          - "'/etc/niri/config.kdl' not in (qubix_niri_resources | map(attribute='path') | list)"
          - qubix_niri_resources[-2].validate == '/usr/bin/niri validate --config %s'
          - "'--config /etc/niri/qubix/config.kdl' in qubix_niri_resources[-1].content"
          - "'spawn-at-startup \"/usr/share/qubix/bin/qubix-noctalia\"' in qubix_niri_resources[-2].content"
          - "'/usr/bin/waybar' not in qubix_niri_resources[-2].content"
          - "'/usr/bin/mako' not in qubix_niri_resources[-2].content"
          - "'/usr/bin/swaybg' not in qubix_niri_resources[-2].content"
          - "'/usr/bin/fuzzel' not in qubix_niri_resources[-2].content"
          - "'polkit-kde-authentication-agent-1' not in qubix_niri_resources[-2].content"
          - "'geometry-corner-radius 16' in qubix_niri_resources[-2].content"
          - qubix_shell_resources | length == 3
          - "'draw-border-with-background false' in qubix_niri_config_content"
          - "'TERMINAL \"/usr/share/qubix/bin/qubix-wezterm\"' in qubix_niri_config_content"
          - qubix_niri_config_content.count('spawn "/usr/share/qubix/bin/qubix-wezterm" "start"') == 2
          - "'/usr/bin/foot' not in qubix_niri_config_content"
          - >-
            'TERMINAL=/usr/share/qubix/bin/qubix-wezterm' in (qubix_niri_resources | selectattr('path', 'equalto',
            '/usr/share/qubix/bin/qubix-noctalia') | first).content
          - "'/etc/qubix/foot.ini' not in (qubix_niri_resources | map(attribute='path') | list)"

    - name: Require generated shortcut data to cover the actual labelled KDL bindings
      ansible.builtin.set_fact:
        qubix_test_shortcuts: >-
          {{ (qubix_niri_resources | selectattr('path', 'equalto',
          '/usr/share/qubix/noctalia/plugins/shortcuts/bindings.json') | first).content | from_json }}
        qubix_test_bind_keys: >-
          {{ qubix_niri_config_content.split('binds {', 1)[1]
          | regex_findall('(?m)^[ \t]+([^\s/{]+)[ \t]+[^\n]*\{') }}

    - name: Reject empty duplicated or stale shortcut display data
      ansible.builtin.assert:
        that:
          - qubix_test_shortcuts | length > 40
          - qubix_test_shortcuts | map('first') | sort == qubix_test_bind_keys | sort
          - >-
            qubix_test_shortcuts | map('last')
            | reject('match', '^(Applications|Windows|Navigation|Session|Media) / .+$') | list | length == 0
          - "'Windows / Resize column wider' in (qubix_test_shortcuts | map('last') | list)"
          - "'Windows / Resize window shorter' in (qubix_test_shortcuts | map('last') | list)"
          - "'Windows / Reset window height' in (qubix_test_shortcuts | map('last') | list)"
          - >-
            qubix_test_shortcuts | map('first') | unique | length == qubix_test_shortcuts | length
          - >-
            qubix_test_shortcuts | length ==
            qubix_niri_config_content | regex_findall('hotkey-overlay-title=') | length
          - "'Session / Keyboard shortcuts' in (qubix_test_shortcuts | map('last') | list)"

    - name: Require complete custom palette and readable primary text
      ansible.builtin.assert:
        that:
          - >-
            (qubix_niri_resources | selectattr('path', 'equalto', '/etc/qubix/noctalia/palettes/Qubix.json')
            | first).content | from_json is mapping
          - >-
            ((qubix_niri_resources | selectattr('path', 'equalto', '/etc/qubix/noctalia/palettes/Qubix.json')
            | first).content | from_json).dark | length == 17
          - >-
            ((qubix_niri_resources | selectattr('path', 'equalto', '/etc/qubix/noctalia/palettes/Qubix.json')
            | first).content | from_json).dark.mPrimary == '#56728b'

    - name: Require shell grammar validation and executable profile launcher
      ansible.builtin.assert:
        that:
          - >-
            (qubix_niri_resources | selectattr('path', 'equalto', '/etc/qubix/noctalia/config.toml')
            | first).validate == '/usr/bin/noctalia config validate %s'
          - >-
            (qubix_niri_resources | selectattr('path', 'equalto', '/usr/share/qubix/bin/qubix-noctalia')
            | first).mode == '0755'

    - name: Reject missing or unsupported installed Noctalia
      ansible.builtin.include_tasks: ../tasks/noctalia-rejection.yml
      loop:
        - name: missing Pinyin packages
          binaries: {niri: true, wezterm: true, noctalia: true, jq: true}
          version: noctalia v5.2.1
          error: Qubix Pinyin requires installed fcitx5
        - name: missing WezTerm
          binaries: {niri: true, noctalia: true, jq: true}
          version: noctalia v5.2.1
          error: requires installed wezterm
        - name: missing Noctalia
          binaries: {niri: true, wezterm: true, jq: true}
          version: unknown
          error: requires installed noctalia
        - name: legacy shell
          binaries: {niri: true, wezterm: true, noctalia: true, jq: true}
          version: noctalia v4.9.0
          error: requires standalone Noctalia
        - name: older v5
          binaries: {niri: true, wezterm: true, noctalia: true, jq: true}
          version: noctalia v5.1.0
          error: requires standalone Noctalia
        - name: unknown major
          binaries: {niri: true, wezterm: true, noctalia: true, jq: true}
          version: noctalia v6.0.0
          error: requires standalone Noctalia
        - name: no version proof
          binaries: {niri: true, wezterm: true, noctalia: true, jq: true}
          version: unknown
          error: requires standalone Noctalia
        - name: missing scale JSON parser
          binaries: {niri: true, wezterm: true, noctalia: true}
          version: noctalia v5.2.1
          error: requires installed jq
      loop_control:
        loop_var: qubix_test_noctalia_case
        label: '{{ qubix_test_noctalia_case.name }}'
