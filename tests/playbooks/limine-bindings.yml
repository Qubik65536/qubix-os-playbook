---
- name: Test Limine binding refusals and check-mode isolation
  hosts: localhost
  gather_facts: true
  gather_subset: ['!all', min]
  become: false
  vars:
    qubix_test_cache_config: |
      /Primary
        protocol: linux
        path: boot():/native/vmlinuz#{{ 'kernel' | hash('blake2b') }}
        module_path: boot():/native/initramfs#{{ 'native-image' | hash('blake2b') }}
        cmdline: root=UUID=preserved quiet splash
  tasks:
    - name: Create only a disposable binding fixture
      ansible.builtin.tempfile:
        state: directory
        path: '{{ playbook_dir }}/../../.cache/tests'
        prefix: qubix-limine-bindings-
      check_mode: false
      register: qubix_test_tmp

    - name: Resolve fixture metadata
      ansible.builtin.set_fact:
        qubix_root: '{{ qubix_test_tmp.path }}'
        qubix_files_owner: '{{ ansible_facts.user_id }}'
        qubix_files_group: '{{ ansible_facts.user_gid | string }}'
        qubix_plymouth_b2sum_binary: '{{ qubix_test_tmp.path }}/b2sum'
        qubix_plymouth_fingerprint: fixture-fingerprint
        qubix_plymouth_kernels:
          results:
            - item: {path: /boot/source.img, kernel_image: /boot/vmlinuz}
              stat: {checksum: '{{ "kernel" | hash("sha256") }}'}
        qubix_profile_resolved:
          branding: {enabled: true}
          bootloader:
            enabled: false
            backend: limine
            confirm_active: true
            config_path: /boot/limine.conf
            limine_version: 12
          plymouth:
            confirm_active: true
            force_rebuild: false
            initramfs_backend: dracut
            presets: []
            images:
              - path: /boot/source.img
                kernel: 6.0-fixture
                kernel_image: /boot/vmlinuz
                limine_image: /boot/native/initramfs
                limine_kernel_image: /boot/native/vmlinuz

    - name: Exercise bindings with guaranteed fixture cleanup
      block:
        - name: Seed native fixture directory
          ansible.builtin.file:
            path: '{{ qubix_root }}/boot/native'
            state: directory
            mode: '0700'
          check_mode: false

        - name: Seed measured fixture files
          ansible.builtin.copy:
            dest: '{{ qubix_root }}{{ item.path }}'
            content: '{{ item.content }}'
            mode: '0700'
          loop:
            - {path: /boot/native/vmlinuz, content: kernel}
            - {path: /boot/native/initramfs, content: native-image}
            - {path: /boot/limine.conf, content: '{{ qubix_test_cache_config }}'}
            - {path: /boot/vmlinuz, content: kernel}
            - {path: /boot/source.img, content: source-image}
          check_mode: false

        - name: Seed test-only digest tool and FAT query substitute
          ansible.builtin.copy:
            dest: '{{ qubix_root }}/{{ item.name }}'
            content: '{{ item.content }}'
            mode: '0700'
          check_mode: false
          loop:
            - name: b2sum
              content: |
                #!/usr/bin/env python3
                import hashlib, pathlib, sys
                print(hashlib.blake2b(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() + '  ' + sys.argv[1])
            - name: findmnt
              content: |
                #!/usr/bin/env bash
                printf 'vfat\n'

        - name: Select only the fixture filesystem probe
          ansible.builtin.set_fact:
            qubix_bootloader_findmnt_binary: '{{ qubix_root }}/findmnt'

        - name: Plan valid pinned binding with simulated FAT mount semantics
          ansible.builtin.include_role:
            name: qubix_plymouth
            tasks_from: limine_plan

        - name: Require inherited FAT modes and exact original recovery pin
          ansible.builtin.assert:
            that:
              - qubix_plymouth_limine_file_mode == '0700'
              - qubix_plymouth_limine_directory_mode == '0700'
              - qubix_plymouth_limine_aliases[0].original_uri.endswith('native-image' | hash('blake2b'))

        - name: Confirm check mode never generates images or takes baselines
          ansible.builtin.include_role:
            name: qubix_plymouth
            tasks_from: rebuild
          when: ansible_check_mode

        - name: Test missing and ambiguous native pins before any activation
          ansible.builtin.include_tasks: ../tasks/limine-binding-rejection.yml
          loop:
            - name: module pin mismatch
              config: '{{ qubix_test_cache_config | replace("native-image" | hash("blake2b"), "0" * 128) }}'
              kernel: kernel
              error: Limine module pin differs
            - name: duplicate kernel binding
              config: '{{ qubix_test_cache_config ~ qubix_test_cache_config }}'
              kernel: kernel
              error: Missing or ambiguous primary
            - name: mismatched cached kernel
              config: '{{ qubix_test_cache_config }}'
              kernel: different-kernel
              error: Cached kernel differs
            - name: missing explicit cache binding
              config: '{{ qubix_test_cache_config }}'
              kernel: kernel
              images:
                - {path: /boot/source.img, kernel: 6.0-fixture, kernel_image: /boot/vmlinuz}
              error: Limine Plymouth requires
          loop_control:
            loop_var: qubix_test_binding_case

        - name: Inspect absence of all persistent deployment state
          ansible.builtin.stat:
            path: '{{ qubix_root }}/var/lib/qubix'
          register: qubix_test_state

        - name: Require refusal and preview to have no deployment writes
          ansible.builtin.assert:
            that: [not qubix_test_state.stat.exists]

        - name: Exercise metadata enrollment and FAT asset modes only outside check mode
          when: not ansible_check_mode
          block:
            - name: Restore valid native config after refusal controls
              ansible.builtin.copy:
                dest: '{{ qubix_root }}/boot/limine.conf'
                content: '{{ qubix_test_cache_config }}'
                mode: '0700'

            - name: Create an earlier appearance-only first baseline
              ansible.builtin.include_role:
                name: qubix_files
              vars:
                qubix_files_resources:
                  - path: /boot/limine.conf
                    component: bootloader
                    content: '{{ qubix_test_cache_config }}'
                    mode: '0700'
                    limine_appearance_keys: [wallpaper]

            - name: Validate enrollment against the intact first config
              ansible.builtin.include_role:
                name: qubix_plymouth
                tasks_from: limine_plan

            - name: Enroll aliases and apply an asset with observed FAT permissions
              ansible.builtin.include_role:
                name: qubix_files
              vars:
                qubix_files_resources:
                  - '{{ qubix_plymouth_limine_config_resource }}'
                  - path: /boot/qubix/fixture.png
                    component: bootloader
                    content: fixture-image
                    mode: '{{ qubix_plymouth_limine_file_mode }}'
                    directory_mode: '{{ qubix_plymouth_limine_directory_mode }}'

            - name: Read enriched first baseline
              ansible.builtin.slurp:
                src: '{{ qubix_root }}/var/lib/qubix/backup/{{ "/boot/limine.conf" | hash("sha256") }}.json'
              register: qubix_test_enrolled

            - name: Inspect original bytes and effective asset permissions
              ansible.builtin.stat:
                path: '{{ qubix_root }}{{ item }}'
                checksum_algorithm: sha256
              loop:
                - '/var/lib/qubix/backup/{{ "/boot/limine.conf" | hash("sha256") }}.original'
                - /boot/qubix/fixture.png
                - /boot/qubix
              register: qubix_test_enrolled_files

            - name: Require original metadata and bytes preserved with explicit aliases and mount modes
              ansible.builtin.assert:
                that:
                  - (qubix_test_enrolled.content | b64decode | from_json).limine_module_aliases | length == 1
                  - (qubix_test_enrolled.content | b64decode | from_json).limine_appearance_keys == ['wallpaper']
                  - qubix_test_enrolled_files.results[0].stat.checksum == qubix_test_cache_config | hash('sha256')
                  - qubix_test_enrolled_files.results[1].stat.mode == '0700'
                  - qubix_test_enrolled_files.results[2].stat.mode == '0700'

            - name: Simulate missing config alongside updated native cache
              ansible.builtin.file:
                path: '{{ qubix_root }}/boot/limine.conf'
                state: absent

            - name: Change the native kernel to invalidate retained pins
              ansible.builtin.copy:
                dest: '{{ qubix_root }}/boot/native/vmlinuz'
                content: updated-kernel
                mode: '0700'

            - name: Reset missing-config refusal
              ansible.builtin.set_fact:
                qubix_test_missing_refused: false

            - name: Reject force restoration of missing config with stale kernel pins
              block:
                - name: Attempt missing-config recovery
                  ansible.builtin.include_role:
                    name: qubix_files
                    tasks_from: restore
                  vars:
                    qubix_files_force_restore: true
              rescue:
                - name: Require the native cache safety diagnostic
                  ansible.builtin.assert:
                    that: ["'Preserved Limine cache image or kernel changed' in (ansible_failed_result | to_json)"]
                - name: Record missing-config safety refusal
                  ansible.builtin.set_fact:
                    qubix_test_missing_refused: true

            - name: Inspect asset preservation after refused missing-config recovery
              ansible.builtin.stat:
                path: '{{ qubix_root }}/boot/qubix/fixture.png'
              register: qubix_test_missing_asset

            - name: Require missing config to stop recovery before asset removal
              ansible.builtin.assert:
                that:
                  - qubix_test_missing_refused
                  - qubix_test_missing_asset.stat.isreg | default(false)
      always:
        - name: Remove only the disposable binding fixture
          ansible.builtin.file:
            path: '{{ qubix_test_tmp.path }}'
            state: absent
          check_mode: false
