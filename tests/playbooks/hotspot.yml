---
- name: Test native hotspot launcher preflight without network mutations
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Accept prepared native executable evidence
      ansible.builtin.include_role:
        name: qubix_hotspot
        tasks_from: plan
      vars:
        qubix_hotspot_prerequisites:
          results:
            - item: wihotspot
              stat: {exists: true, executable: true}

    - name: Require an additive unprivileged native launcher without credentials
      ansible.builtin.assert:
        that:
          - qubix_hotspot_resources | length == 1
          - qubix_hotspot_resources[0].path == '/usr/share/applications/qubix-hotspot.desktop'
          - "'Exec=/usr/bin/wihotspot\n' in qubix_hotspot_resources[0].content"
          - "'password' not in qubix_hotspot_resources[0].content"
          - "'sudo' not in qubix_hotspot_resources[0].content"

    - name: Reject missing or unusable native executables
      ansible.builtin.include_tasks: ../tasks/hotspot-rejection.yml
      loop:
        - {exists: false}
        - {exists: true, executable: false}
      loop_control:
        loop_var: qubix_hotspot_test_stat
