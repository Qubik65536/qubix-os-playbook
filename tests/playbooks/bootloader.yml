---
- name: Test GRUB and Limine preservation independently in a disposable root
  hosts: localhost
  gather_facts: true
  gather_subset: ['!all', min]
  become: false
  vars:
    # Controller dispatch stub; native GRUB parsing is explicitly a VM gate.
    qubix_bootloader_grub_checker: /usr/bin/true
    qubix_discovery_report:
      evidence:
        binaries: {grub-mkconfig: true, grub-script-check: true, limine: true}
        packages: []
  tasks:
    - name: Create boot fixture root
      ansible.builtin.tempfile:
        state: directory
        path: '{{ playbook_dir }}/../../.cache/tests'
        prefix: qubix-boot-
      register: qubix_test_tmp

    - name: Use disposable boot paths
      ansible.builtin.set_fact:
        qubix_root: '{{ qubix_test_tmp.path }}'
        qubix_files_owner: '{{ ansible_facts.user_id }}'
        qubix_files_group: '{{ ansible_facts.user_gid | string }}'

    - name: Exercise both adapters and rejection with guaranteed cleanup
      block:
        - name: Create fake boot configuration directories
          ansible.builtin.file:
            path: '{{ qubix_root }}/boot/grub'
            state: directory
            mode: '0755'

        - name: Seed GRUB active configuration, hook and Limine entries
          ansible.builtin.copy:
            dest: '{{ qubix_root }}{{ item.path }}'
            content: '{{ item.content }}'
            mode: '0644'
          loop:
            - path: /boot/grub/grub.cfg
              content: |
                menuentry 'CachyOS' {
                  linux /vmlinuz root=UUID=keep cryptdevice=UUID=keep:root quiet splash
                }
                source $prefix/custom.cfg
            - path: /boot/grub/custom.cfg
              content: |
                # unrelated operator hook
                set operator_setting=preserve
            - path: /boot/limine.conf
              content: |
                timeout: 5
                interface_branding: CachyOS
                /CachyOS
                    protocol: linux
                    path: boot():/vmlinuz-linux-cachyos
                    cmdline: root=UUID=keep cryptdevice=UUID=keep:root quiet splash
                    module_path: boot():/initramfs-linux-cachyos.img

        - name: Protect pre-existing activation files with private modes
          ansible.builtin.file:
            path: '{{ qubix_root }}{{ item }}'
            mode: '0600'
          loop: [/boot/grub/custom.cfg, /boot/limine.conf]

        - name: Record original boot fixture hashes before activation
          ansible.builtin.stat:
            path: '{{ qubix_root }}{{ item }}'
            checksum_algorithm: sha256
          loop: [/boot/grub/grub.cfg, /boot/grub/custom.cfg, /boot/limine.conf]
          register: qubix_test_original_boot

        - name: Select confirmed GRUB fixture
          ansible.builtin.set_fact:
            qubix_profile_resolved:
              bootloader:
                backend: grub
                confirm_active: true
                config_path: /boot/grub/grub.cfg
                limine_version: 0

        - name: Prepare GRUB appearance
          ansible.builtin.include_role:
            name: qubix_bootloader

        - name: Retain first hook result
          ansible.builtin.set_fact:
            qubix_test_grub_hook: '{{ qubix_bootloader_resources[-1].content }}'

        - name: Require unrelated hook content and existing boot args to survive
          ansible.builtin.assert:
            that:
              - "'set operator_setting=preserve' in qubix_test_grub_hook"
              - qubix_bootloader_resources | length == 2
              - qubix_bootloader_resources[-1].path == '/boot/grub/custom.cfg'
              - qubix_bootloader_resources[-1].mode == '0600'
              - "'cryptdevice=UUID=keep:root' in qubix_bootloader_text"

        - name: Install GRUB resources through the real baseline engine in the fixture
          ansible.builtin.include_role:
            name: qubix_files
          vars:
            qubix_files_resources: '{{ qubix_bootloader_resources }}'

        - name: Reapply unchanged GRUB resources through the engine
          ansible.builtin.include_role:
            name: qubix_files
          vars:
            qubix_files_resources: '{{ qubix_bootloader_resources }}'

        - name: Require unchanged GRUB activation copy
          ansible.builtin.assert:
            that: [not qubix_files_write.changed]

        - name: Prepare GRUB again
          ansible.builtin.include_role:
            name: qubix_bootloader

        - name: Require stable repeated hook generation
          ansible.builtin.assert:
            that:
              - qubix_bootloader_resources[-1].content == qubix_test_grub_hook

        - name: Select confirmed Limine fixture
          ansible.builtin.set_fact:
            qubix_profile_resolved:
              bootloader:
                backend: limine
                confirm_active: true
                config_path: /boot/limine.conf
                limine_version: 10

        - name: Prepare Limine appearance independently
          ansible.builtin.include_role:
            name: qubix_bootloader

        - name: Save first Limine result
          ansible.builtin.set_fact:
            qubix_test_limine: '{{ qubix_bootloader_resources[0].content }}'

        - name: Require entry preservation and unique branding
          ansible.builtin.assert:
            that:
              - qubix_test_limine.split('/CachyOS')[1] == qubix_bootloader_text.split('/CachyOS')[1]
              - "'timeout: 5' in qubix_test_limine"
              - qubix_bootloader_resources[0].mode == '0600'
              - qubix_test_limine | regex_findall('(?m)^interface_branding:') | length == 1

        - name: Install Limine through its independent recorded baseline
          ansible.builtin.include_role:
            name: qubix_files
          vars:
            qubix_files_resources: '{{ qubix_bootloader_resources }}'

        - name: Reapply unchanged Limine resource through the engine
          ansible.builtin.include_role:
            name: qubix_files
          vars:
            qubix_files_resources: '{{ qubix_bootloader_resources }}'

        - name: Require unchanged Limine activation copy
          ansible.builtin.assert:
            that: [not qubix_files_write.changed]

        - name: Prepare Limine again
          ansible.builtin.include_role:
            name: qubix_bootloader

        - name: Require stable repeated Limine appearance generation
          ansible.builtin.assert:
            that:
              - qubix_bootloader_resources[0].content == qubix_test_limine

        - name: Require restoration guards after preserved edits and reapplication
          ansible.builtin.include_tasks: ../tasks/boot-stale-restore.yml
          loop:
            - {backend: grub, config: /boot/grub/grub.cfg, activation: /boot/grub/custom.cfg}
            - {backend: limine, config: /boot/limine.conf, activation: /boot/limine.conf}
          loop_control:
            loop_var: qubix_test_boot_case

        - name: Introduce unsupported firmware version
          ansible.builtin.set_fact:
            qubix_profile_resolved:
              bootloader: {backend: limine, confirm_active: true, config_path: /boot/limine.conf, limine_version: 7}
            qubix_test_rejected: false

        - name: Require version rejection
          block:
            - name: Attempt unsupported Limine activation
              ansible.builtin.include_role:
                name: qubix_bootloader
          rescue:
            - name: Require a version compatibility diagnostic
              ansible.builtin.assert:
                that: ["'confirmed major' in ansible_failed_result.msg"]
            - name: Record expected rejection
              ansible.builtin.set_fact:
                qubix_test_rejected: true

        - name: Require unsupported version to fail
          ansible.builtin.assert:
            that: [qubix_test_rejected]
        - name: Restore both adapters from their real file baselines
          ansible.builtin.include_role:
            name: qubix_files
            tasks_from: restore

        - name: Read restored activation files and preserved generated entries
          ansible.builtin.stat:
            path: '{{ qubix_root }}{{ item.item }}'
            checksum_algorithm: sha256
          loop: '{{ qubix_test_original_boot.results }}'
          register: qubix_test_restored_boot
          loop_control:
            label: '{{ item.item }}'

        - name: Require exact original bytes for both adapters and untouched generated GRUB
          ansible.builtin.assert:
            that:
              - item.stat.checksum == item.item.stat.checksum
              - item.stat.mode == item.item.stat.mode
          loop: '{{ qubix_test_restored_boot.results }}'
          loop_control:
            label: '{{ item.item.item }}'

        - name: Inspect originally absent GRUB theme resource
          ansible.builtin.stat:
            path: '{{ qubix_root }}/boot/grub/themes/qubix/theme.txt'
          register: qubix_test_removed_theme

        - name: Require restoration removes only the newly added theme file
          ansible.builtin.assert:
            that: [not qubix_test_removed_theme.stat.exists]

        - name: Prepare a separate originally absent GRUB hook case
          ansible.builtin.file:
            path: '{{ qubix_root }}{{ item }}'
            state: absent
          loop:
            - /boot/grub/custom.cfg
            - '/var/lib/qubix/backup/{{ "/boot/grub/custom.cfg" | hash("sha256") }}.json'
            - '/var/lib/qubix/backup/{{ "/boot/grub/custom.cfg" | hash("sha256") }}.original'
            - '/var/lib/qubix/backup/{{ "/boot/grub/custom.cfg" | hash("sha256") }}.receipt'

        - name: Select supported GRUB with an absent custom hook
          ansible.builtin.set_fact:
            qubix_profile_resolved:
              bootloader:
                backend: grub
                confirm_active: true
                config_path: /boot/grub/grub.cfg
                limine_version: 0

        - name: Prepare appearance without assumed existing hook content
          ansible.builtin.include_role:
            name: qubix_bootloader

        - name: Install the newly owned hook with an absence baseline
          ansible.builtin.include_role:
            name: qubix_files
          vars:
            qubix_files_resources: '{{ qubix_bootloader_resources }}'

        - name: Restore only recorded original absence with preservation guards
          ansible.builtin.include_role:
            name: qubix_files
            tasks_from: restore

        - name: Inspect the restored originally absent hook
          ansible.builtin.stat:
            path: '{{ qubix_root }}/boot/grub/custom.cfg'
          register: qubix_test_absent_hook

        - name: Require safe removal of the new hook
          ansible.builtin.assert:
            that: [not qubix_test_absent_hook.stat.exists]
      always:
        - name: Remove only disposable boot fixtures
          ansible.builtin.file:
            path: '{{ qubix_test_tmp.path }}'
            state: absent
