---
- name: Restore recorded Qubix resources to the first pre-deployment baseline
  hosts: qubix_targets
  gather_facts: false
  become: false
  roles:
    - qubix_discovery
  tasks:
    - name: Restore recorded bytes, metadata and original absence
      ansible.builtin.include_role:
        name: qubix_files
        tasks_from: restore
        apply:
          become: true

    - name: Inspect optional font cache receipt after resource restoration
      ansible.builtin.stat:
        path: /var/lib/qubix/fonts-inputs.sha256
        follow: false
      become: true
      register: qubix_restore_fonts

    - name: Refresh system font cache after restoring original font resources
      ansible.builtin.command:
        argv: [/usr/bin/fc-cache, --system-only]
      become: true
      changed_when: true
      when: qubix_restore_fonts.stat.exists and not ansible_check_mode

    - name: Compile restored system GTK defaults
      ansible.builtin.command:
        argv: [/usr/bin/glib-compile-schemas, --strict, /usr/share/glib-2.0/schemas]
      become: true
      changed_when: true
      when: qubix_restore_fonts.stat.exists and not ansible_check_mode

    - name: Clear restored font cache receipt
      ansible.builtin.file:
        path: /var/lib/qubix/fonts-inputs.sha256
        state: absent
      become: true
      when: qubix_restore_fonts.stat.exists and not ansible_check_mode

    - name: Clear image input markers after successful baseline restoration
      ansible.builtin.file:
        path: '/var/lib/qubix/{{ item }}'
        state: absent
      loop: [plymouth-inputs.sha256, plymouth-pending, deployment-pending.json]
      become: true

    - name: Mark deployment as restored after successful recovery
      ansible.builtin.copy:
        dest: /var/lib/qubix/deployment.json
        content: '{"status": "restored", "graphical_session_verified": false, "boot_verified": false}
'
        mode: '0600'
      become: true
      when: not ansible_check_mode
