---
- name: Prepare isolated presentation builds without session or boot activation
  hosts: qubix_targets
  gather_facts: false
  become: false
  roles:
    - qubix_profile
    - qubix_discovery
  tasks:
    - name: Load pinned source and patch checksums
      ansible.builtin.include_vars:
        file: ../assets/ui/manifest.yml
        name: qubix_ui_sources

    - name: Measure the build account without granting root to source builds
      ansible.builtin.command:
        argv: [/usr/bin/id, -u]
      changed_when: false
      check_mode: false
      register: qubix_ui_uid

    - name: Require a non-root builder and matching native releases
      ansible.builtin.assert:
        that:
          - qubix_ui_uid.stdout != '0'
          - qubix_discovery_report.evidence.noctalia_version is regex('v?5\.3\.0(?:\s|$)')
          - >-
            lookup('file', '../assets/ui/noctalia.patch', rstrip=false) | hash('sha256') ==
            qubix_ui_sources.noctalia.patch_sha256
          - >-
            lookup('file', '../assets/ui/greeter.patch', rstrip=false) | hash('sha256') ==
            qubix_ui_sources.greeter.patch_sha256

    - name: Measure the installed native greeter before package preparation
      ansible.builtin.command:
        argv: [/usr/bin/noctalia-greeter, --version]
      changed_when: false
      check_mode: false
      register: qubix_ui_native_greeter

    - name: Require the exact reviewed native greeter release
      ansible.builtin.assert:
        that:
          - qubix_ui_native_greeter.stdout == 'noctalia-greeter 1.6.0'

    - name: Read installed packages for the explicit preparation transaction
      ansible.builtin.command:
        argv: [/usr/bin/pacman, -Qq]
      register: qubix_ui_packages
      changed_when: false
      check_mode: false

    - name: Resolve missing native UI and compilation prerequisites
      ansible.builtin.set_fact:
        qubix_ui_missing: >-
          {{ ['gcc', 'make', 'patch', 'pkgconf', 'meson', 'ninja', 'gjs', 'gtk4', 'fprintd',
          'wayland-protocols', 'tomlplusplus', 'nlohmann-json', 'stb', 'sdbus-cpp', 'libqalculate',
          'md4c', 'libical', 'libjxl', 'libsndfile', 'wlroots0.20']
          | difference(qubix_ui_packages.stdout_lines) }}

    - name: Show exact dependency transaction without installing in check mode
      ansible.builtin.command:
        argv: '{{ ["/usr/bin/pacman", "-Sp", "--print-format", "%n %v %s", "--"] + qubix_ui_missing }}'
      changed_when: false
      check_mode: false
      when: qubix_ui_missing | length > 0

    - name: Install only missing UI prerequisites using the existing package database
      ansible.builtin.command:
        argv: '{{ ["/usr/bin/pacman", "-S", "--needed", "--noconfirm", "--"] + qubix_ui_missing }}'
      become: true
      changed_when: true
      when: qubix_ui_missing | length > 0

    - name: Prepare each checksum-pinned source as the ordinary account
      ansible.builtin.include_tasks: tasks/build-ui.yml
      loop: '{{ qubix_ui_sources | dict2items }}'
      loop_control:
        loop_var: qubix_ui_source
        label: '{{ qubix_ui_source.key }}'
      when: not ansible_check_mode

    - name: Explain installation and activation boundary
      ansible.builtin.debug:
        msg: >-
          Preparation does not select the private binaries, restart services, change PAM or reboot.
          Deploy with niri.presentation=qubix, niri.fingerprint_setup=true and login.compact=true
          only after native isolated rendering checks pass.
