---
- name: Deploy supported Qubix customizations
  hosts: qubix_targets
  gather_facts: false
  become: false
  roles:
    - role: qubix_profile
      tags: [always]
    - role: qubix_discovery
      tags: [always]
  tasks:
    - name: Install and verify enabled Qubix branding
      ansible.builtin.include_role:
        name: qubix_branding
        apply:
          become: true
          tags: [branding]
      when: qubix_profile_resolved.branding.enabled
      tags: [branding]

    - name: Report disabled deployment selection
      ansible.builtin.debug:
        msg: 'No components enabled; completed preflight without customization writes.'
      when: qubix_profile_enabled | length == 0
