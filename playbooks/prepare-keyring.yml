---
- name: Prepare native KWallet packages without changing the active provider
  hosts: qubix_targets
  gather_facts: false
  become: false
  roles:
    - qubix_profile
    - qubix_discovery
  tasks:
    - name: Read installed package names
      ansible.builtin.command:
        argv: [/usr/bin/pacman, -Qq]
      register: qubix_keyring_packages
      changed_when: false
      check_mode: false

    - name: Resolve only missing KWallet prerequisites
      ansible.builtin.set_fact:
        qubix_keyring_missing: >-
          {{ ["kwallet", "kwallet-pam", "kwalletmanager"] | difference(qubix_keyring_packages.stdout_lines) }}

    - name: Preview the native package transaction
      ansible.builtin.command:
        argv: '{{ ["/usr/bin/pacman", "-Sp", "--print-format", "%n %v", "--"] + qubix_keyring_missing }}'
      changed_when: false
      check_mode: false
      when: qubix_keyring_missing | length > 0

    - name: Install requested prerequisites with native package hooks
      ansible.builtin.command:
        argv: '{{ ["/usr/bin/pacman", "-S", "--needed", "--noconfirm", "--"] + qubix_keyring_missing }}'
      become: true
      changed_when: true
      when: qubix_keyring_missing | length > 0
