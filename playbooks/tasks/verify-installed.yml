---
- name: Resolve selected expected resources
  ansible.builtin.import_tasks: plan.yml

- name: Verify selected installed files without mutation
  ansible.builtin.include_role:
    name: qubix_files
    tasks_from: verify
    apply:
      become: >-
        {{ qubix_profile_resolved.login.enabled or qubix_profile_resolved.bootloader.enabled or
        qubix_profile_resolved.plymouth.enabled }}
  vars:
    qubix_files_resources: '{{ qubix_deployment_resources }}'

- name: Validate installed Niri configuration with the target parser
  ansible.builtin.command:
    argv: [/usr/bin/niri, --config, /etc/niri/qubix/config.kdl, validate]
  changed_when: false
  check_mode: false
  when: qubix_profile_resolved.niri.enabled

- name: Verify selected image resources without rebuilding
  ansible.builtin.include_role:
    name: qubix_plymouth
    tasks_from: verify_images
    apply:
      become: true
  when: qubix_profile_resolved.plymouth.enabled
