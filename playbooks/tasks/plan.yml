---
- name: Initialize selected resource definitions
  ansible.builtin.set_fact:
    qubix_deployment_resources: []
    qubix_branding_resources: []
    qubix_niri_resources: []
    qubix_shell_resources: []
    qubix_login_resources: []
    qubix_bootloader_resources: []
    qubix_plymouth_resources: []

- name: Prepare enabled branding
  ansible.builtin.include_role:
    name: qubix_branding
    tasks_from: plan
  when: qubix_profile_resolved.branding.enabled

- name: Validate and prepare enabled Niri session
  ansible.builtin.include_role:
    name: qubix_niri
  when: qubix_profile_resolved.niri.enabled

- name: Prepare enabled shell defaults
  ansible.builtin.include_role:
    name: qubix_shell
  when: qubix_profile_resolved.shell.enabled

- name: Validate and prepare supported login appearance
  ansible.builtin.include_role:
    name: qubix_login
    apply:
      become: true
  when: qubix_profile_resolved.login.enabled

- name: Validate and prepare the explicitly confirmed bootloader
  ansible.builtin.include_role:
    name: qubix_bootloader
    apply:
      become: true
  when: qubix_profile_resolved.bootloader.enabled

- name: Validate and prepare confirmed Plymouth integration
  ansible.builtin.include_role:
    name: qubix_plymouth
    apply:
      become: true
  when: qubix_profile_resolved.plymouth.enabled

- name: Resolve ordered deployment resources after all capability checks
  ansible.builtin.set_fact:
    qubix_deployment_resources: >-
      {{ qubix_branding_resources + qubix_niri_resources + qubix_shell_resources +
      qubix_login_resources +
      ((qubix_bootloader_resources | rejectattr('path', 'equalto', '/boot/limine.conf') | list +
      [qubix_plymouth_limine_config_resource]) if qubix_profile_resolved.plymouth.enabled and
      qubix_plymouth_limine_required | default(false) else qubix_bootloader_resources) + qubix_plymouth_resources }}
