---
- name: Load attributed wallpaper digest
  ansible.builtin.include_vars:
    file: '{{ role_path }}/../../assets/wallpaper/manifest.yml'
    name: qubix_niri_wallpaper

- name: Initialize desktop resource definitions
  ansible.builtin.set_fact:
    qubix_niri_resources:
      - path: /usr/share/qubix/wallpaper.png
        source: '{{ role_path }}/../../assets/wallpaper/qubix.png'
        sha256: '{{ qubix_niri_wallpaper.sha256 }}'
        component: niri

- name: Add Pinyin defaults with personal configuration precedence
  ansible.builtin.set_fact:
    qubix_niri_resources: >-
      {{ qubix_niri_resources + [{'path': '/etc/qubix/fcitx5/' ~ item, 'component': 'niri',
      'content': lookup('file', role_path ~ '/files/fcitx5/' ~ item, rstrip=false), 'mode': '0644'}] }}
  loop: [config, profile]

- name: Render canonical KDL before deriving its shortcut display data
  ansible.builtin.set_fact:
    qubix_niri_config_content: '{{ lookup("template", "config.kdl.j2") }}'

- name: Include the local shortcut presenter files before enabling the plugin
  ansible.builtin.set_fact:
    qubix_niri_resources: >-
      {{ qubix_niri_resources + [{'path': '/usr/share/qubix/noctalia/plugins/shortcuts/' ~ item,
      'component': 'niri', 'content': lookup('file', role_path ~ '/files/shortcuts/' ~ item, rstrip=false)}] }}
  loop: [plugin.toml, panel.luau]

- name: Include the local guarded power panel before enabling the plugin
  ansible.builtin.set_fact:
    qubix_niri_resources: >-
      {{ qubix_niri_resources + [{'path': '/usr/share/qubix/noctalia/plugins/power/' ~ item,
      'component': 'niri', 'content': lookup('file', role_path ~ '/files/power/' ~ item, rstrip=false)}] }}
  loop: [plugin.toml, panel.luau]

- name: Render explicit desktop definitions
  ansible.builtin.set_fact:
    qubix_niri_resources: >-
      {{ qubix_niri_resources + [{'path': item.path, 'component': 'niri',
      'content': lookup('template', item.template)}
      | combine({'validate': item.validate} if item.validate is defined else {})
      | combine({'mode': item.mode} if item.mode is defined else {})] }}
  loop:
    - path: /usr/share/qubix/bin/qubix-fcitx5
      template: fcitx5.sh.j2
      validate: /usr/bin/bash -n %s
      mode: '0755'
    - path: /usr/share/qubix/noctalia/plugins/shortcuts/bindings.json
      template: shortcuts.json.j2
    - {path: /etc/niri/qubix/theme.kdl, template: theme.kdl.j2}
    - {path: /etc/qubix/noctalia/palettes/Qubix.json, template: palette.json.j2}
    - path: /usr/share/applications/qubix-power.desktop
      template: power.desktop.j2
    - path: /usr/share/qubix/bin/qubix-output-defaults
      template: output-defaults.sh.j2
      validate: /usr/bin/bash -n %s
      mode: '0755'
    - path: /etc/qubix/noctalia/config.toml
      template: noctalia.toml.j2
      validate: /usr/bin/noctalia config validate %s
    - path: /usr/share/qubix/bin/qubix-noctalia
      template: noctalia.sh.j2
      validate: /usr/bin/bash -n %s
      mode: '0755'

- name: Install native-validation support and supplied terminal assets before activation
  ansible.builtin.set_fact:
    qubix_niri_resources: >-
      {{ qubix_niri_resources + [{'path': item.path, 'component': 'niri',
      'content': lookup('file', role_path ~ '/files/wezterm/' ~ item.source, rstrip=false),
      'mode': item.mode | default('0644')}
      | combine({'validate': item.validate} if item.validate is defined else {})] }}
  loop:
    - path: /usr/share/qubix/bin/qubix-validate-wezterm
      source: validate.sh
      mode: '0755'
      validate: /usr/bin/bash -n %s

- name: Render terminal launch integration after its configuration
  ansible.builtin.set_fact:
    qubix_niri_resources: >-
      {{ qubix_niri_resources + [{'path': item.path, 'component': 'niri',
      'content': lookup('template', item.template), 'mode': item.mode | default('0644')}
      | combine({'validate': item.validate} if item.validate is defined else {})] }}
  loop:
    - path: /usr/share/qubix/bin/qubix-wezterm
      template: wezterm.sh.j2
      mode: '0755'
      validate: /usr/bin/bash -n %s
    - path: /usr/local/share/applications/org.wezfurlong.wezterm.desktop
      template: wezterm.desktop.j2

- name: Place parser-validated configuration before session activation
  ansible.builtin.set_fact:
    qubix_niri_resources: >-
      {{ qubix_niri_resources + [{'path': '/etc/niri/qubix/config.kdl', 'component': 'niri',
      'content': qubix_niri_config_content, 'validate': qubix_niri_validate_binary ~ ' validate --config %s'},
      {'path': '/usr/share/wayland-sessions/qubix-niri.desktop', 'component': 'niri',
      'content': lookup('template', 'session.desktop.j2')}] }}
