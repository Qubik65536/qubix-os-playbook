---
- name: Require supported confirmed Limine version and native config format
  ansible.builtin.assert:
    that:
      - qubix_profile_resolved.bootloader.config_path is match('^/(boot|efi)/.*limine\.conf$')
      - qubix_profile_resolved.bootloader.limine_version is integer
      - qubix_profile_resolved.bootloader.limine_version in [8, 9, 10, 11, 12]
      - >-
        qubix_discovery_report.evidence.binaries.get('limine', false) or
        qubix_discovery_report.evidence.packages | select('match', '^limine ') | list | length > 0
      - qubix_bootloader_text is regex('(?m)^/[^\n]+')
    fail_msg: 'Limine requires confirmed major 8–12, package/tool evidence and a native limine.conf containing entries.'

- name: Initialize existing Limine content
  ansible.builtin.set_fact:
    qubix_bootloader_base: '{{ qubix_bootloader_text }}'

- name: Preserve all content outside the Qubix appearance block
  ansible.builtin.import_tasks: markers.yml

- name: Resolve version-supported Limine appearance ownership
  ansible.builtin.set_fact:
    qubix_bootloader_limine_managed_keys: >-
      {{ qubix_bootloader_limine_graphical_keys if qubix_profile_resolved.bootloader.limine_version == 12
      else qubix_bootloader_limine_text_keys }}

- name: Inspect any earlier config ownership baseline
  ansible.builtin.stat:
    path: >-
      {{ qubix_root | default('') }}/var/lib/qubix/backup/{{
      qubix_profile_resolved.bootloader.config_path | hash('sha256') }}.json
    follow: false
  register: qubix_bootloader_limine_earlier_baseline

- name: Read earlier ownership without changing its original recovery contract
  ansible.builtin.slurp:
    src: '{{ qubix_bootloader_limine_earlier_baseline.stat.path }}'
  register: qubix_bootloader_limine_earlier_bytes
  when: qubix_bootloader_limine_earlier_baseline.stat.exists

- name: Refuse expanding appearance ownership over a narrower existing baseline
  ansible.builtin.assert:
    that:
      - >-
        qubix_bootloader_limine_managed_keys | difference(
        (qubix_bootloader_limine_earlier_bytes.content | b64decode | from_json).limine_appearance_keys
        | default(qubix_bootloader_limine_text_keys)) | length == 0
    fail_msg: >-
      Earlier Limine ownership is narrower; restore/review that baseline before expanding appearance ownership.
  when: qubix_bootloader_limine_earlier_baseline.stat.exists

- name: Validate the graphical ESP location and native enrollment boundary
  ansible.builtin.include_tasks: limine_preflight.yml
  when: qubix_profile_resolved.bootloader.limine_version == 12

- name: Reject duplicate existing appearance directives
  ansible.builtin.assert:
    that:
      - qubix_bootloader_preserved | regex_findall('(?im)^[ \t]*' ~ item ~ '[ \t]*:') | length <= 1
    fail_msg: 'Ambiguous repeated Limine {{ item }} directive; refusing guessed precedence.'
  loop: '{{ qubix_bootloader_limine_managed_keys }}'

- name: Reject duplicate spelling aliases for the branding colour
  ansible.builtin.assert:
    that:
      - qubix_bootloader_preserved | regex_findall('(?im)^[ \t]*interface_branding_colou?r[ \t]*:') | length <= 1
  when: qubix_profile_resolved.bootloader.limine_version == 12

- name: Initialize Limine resource definitions
  ansible.builtin.set_fact:
    qubix_bootloader_resources: []

- name: Load attributed wallpaper metadata for the graphical adapter
  ansible.builtin.include_vars:
    file: '{{ role_path }}/../../assets/wallpaper/manifest.yml'
    name: qubix_bootloader_limine_wallpaper
  when: qubix_profile_resolved.bootloader.limine_version == 12

- name: Place wallpaper on the confirmed boot filesystem before activation
  ansible.builtin.set_fact:
    qubix_bootloader_resources:
      - path: '{{ qubix_bootloader_directory }}/qubix/wallpaper.png'
        source: '{{ role_path }}/../../assets/wallpaper/qubix.png'
        sha256: '{{ qubix_bootloader_limine_wallpaper.sha256 }}'
        mode: '{{ qubix_bootloader_limine_file_mode }}'
        directory_mode: '{{ qubix_bootloader_limine_directory_mode }}'
        component: bootloader
  when: qubix_profile_resolved.bootloader.limine_version == 12

- name: Prepare marked appearance while preserving all entry bytes
  ansible.builtin.set_fact:
    qubix_bootloader_resources: >-
      {{ qubix_bootloader_resources + [{'path': qubix_profile_resolved.bootloader.config_path,
      'component': 'bootloader', 'mode': qubix_bootloader_active_stat.stat.mode,
      'limine_appearance_keys': qubix_bootloader_limine_managed_keys,
      'content': lookup('template', 'limine.conf.j2') ~
      (qubix_bootloader_preserved | regex_replace(
      '(?im)^[ \t]*(' ~ qubix_bootloader_limine_managed_keys | join('|') ~ ')[ \t]*:[^\n]*(?:\n|$)', ''))}] }}
