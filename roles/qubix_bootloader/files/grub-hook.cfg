# BEGIN QUBIX BOOT
if [ -f "$prefix/themes/qubix/theme.txt" ]; then
    insmod all_video
    insmod gfxterm
    insmod gfxmenu
    if [ -f "$prefix/fonts/unicode.pf2" ]; then
        loadfont "$prefix/fonts/unicode.pf2"
    fi
    terminal_output gfxterm
    set theme="$prefix/themes/qubix/theme.txt"
    export theme
fi
# END QUBIX BOOT
