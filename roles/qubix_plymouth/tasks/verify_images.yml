---
- name: Verify exact native font selection without refreshing caches
  ansible.builtin.include_tasks: verify_font.yml
  when: qubix_root | default('') == ''

- name: Inspect exact declared generator outputs
  ansible.builtin.include_tasks: verify_archive.yml
  vars:
    qubix_plymouth_archive_images: '{{ qubix_profile_resolved.plymouth.images }}'

- name: Require the associated kernel files to remain unchanged
  ansible.builtin.stat:
    path: '{{ qubix_root | default("") }}{{ item.item.kernel_image }}'
    checksum_algorithm: sha256
    follow: false
  loop: '{{ qubix_plymouth_kernels.results }}'
  register: qubix_plymouth_kernel_after
  loop_control:
    label: '{{ item.item.kernel_image }}'

- name: Refuse a successful result if a kernel image changed
  ansible.builtin.assert:
    that:
      - item.stat.checksum == item.item.stat.checksum
    fail_msg: 'Kernel image changed unexpectedly; stop and recover the VM snapshot.'
  loop: '{{ qubix_plymouth_kernel_after.results }}'
  loop_control:
    label: '{{ item.item.item.kernel_image }}'

- name: Verify the images actually referenced by Limine without regeneration
  ansible.builtin.include_tasks: verify_limine.yml
  when:
    - qubix_plymouth_verify_active | default(true)
    - qubix_plymouth_limine_bindings | default([]) | length > 0
