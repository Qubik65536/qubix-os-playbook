---
qubix_profile_keys:
  branding: [enabled]
  niri: [enabled, user_config]
  shell: [enabled, change_default_shell]
  login: [enabled, backend, theme_source]
  bootloader: [enabled, backend, config_path, confirm_active, limine_version]
  plymouth: [enabled, early_graphics, initramfs_backend, confirm_active, force_rebuild, images, presets]
qubix_profile_choices:
  - component: niri
    key: user_config
    values: [preserve]
  - component: login
    key: backend
    values: [auto, sddm, greetd, gdm, lightdm]
  - component: bootloader
    key: backend
    values: [auto, grub, limine]
  - component: plymouth
    key: early_graphics
    values: [preserve, simpledrm]
  - component: plymouth
    key: initramfs_backend
    values: [auto, dracut, mkinitcpio]
qubix_profile_implemented: [branding, niri, shell, login, bootloader, plymouth]
