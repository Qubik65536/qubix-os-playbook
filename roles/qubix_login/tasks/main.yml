---
- name: Require a supported login appearance combination
  ansible.builtin.assert:
    that:
      - >-
        (qubix_profile_resolved.login.theme_source == 'breeze' and
        qubix_profile_resolved.login.backend in ['auto', 'sddm'] and
        qubix_profile_resolved.login.activation | default('existing') == 'existing') or
        (qubix_profile_resolved.login.theme_source == 'noctalia' and
        qubix_profile_resolved.login.backend == 'greetd' and
        qubix_profile_resolved.login.activation | default('existing') in ['existing', 'prepare'])
    fail_msg: 'Login requires Breeze/existing SDDM or Noctalia/explicit greetd; managers are never replaced.'

- name: Prepare supported SDDM appearance
  ansible.builtin.include_tasks: sddm.yml
  when: qubix_profile_resolved.login.theme_source == 'breeze'

- name: Prepare supported Noctalia Greeter appearance
  ansible.builtin.include_tasks: noctalia.yml
  when: qubix_profile_resolved.login.theme_source == 'noctalia'
